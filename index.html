<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוזר קניות AI - עופר בלוטריך</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.bot {
            flex-direction: row-reverse;
        }

        .message.user {
            flex-direction: row;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .bot .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .user .avatar {
            background: #e9ecef;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .bot .bubble {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 18px 18px 4px 18px;
        }

        .user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 18px 4px;
        }

        .product-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }

        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-card h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #333;
        }

        .product-card .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }

        .product-card .stock {
            font-size: 0.8rem;
            margin: 5px 0;
        }

        .stock.in-stock {
            color: #28a745;
        }

        .stock.out-of-stock {
            color: #dc3545;
        }

        .product-card .buy-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .product-card .buy-btn:hover {
            transform: scale(1.05);
        }

        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .quick-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
        }

        .input-container {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #e9ecef;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .input-container button:hover {
            transform: scale(1.05);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .powered-by {
            text-align: center;
            padding: 10px;
            font-size: 0.75rem;
            color: #999;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧗 עוזר קניות AI</h1>
            <p>חנות ציוד טיפוס ואימונים - עופר בלוטריך</p>
        </div>

        <div class="chat-container" id="chat">
            <!-- Messages will appear here -->
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="מה אתה מחפש?" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">שלח</button>
        </div>

        <div class="powered-by">
            Powered by WooCommerce Store API + AI
        </div>
    </div>

    <script>
        // Use CORS proxy for demo (in production, fix CORS on your server)
const CORS_PROXY = 'https://corsproxy.io/?';
const STORE_URL = 'https://www.oferblutrich.com/wp-json/wc/store/v1';
const STORE_API = CORS_PROXY + encodeURIComponent(STORE_URL);
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');

        // Initial greeting
        window.onload = () => {
            addBotMessage(`שלום! 👋 אני העוזר החכם של חנות הטיפוס של עופר.

איך אפשר לעזור לך היום?`, [
                { text: '🏋️ אימונים', action: () => searchProducts('אימון') },
                { text: '🧴 מגנזיום', action: () => searchProducts('מגנזיום') },
                { text: '📚 וובינרים', action: () => searchProducts('וובינר') },
                { text: '📦 כל המוצרים', action: () => searchProducts('') }
            ]);
        };

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="avatar">👤</div>
                <div class="bubble">${text}</div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addBotMessage(text, buttons = []) {
            const div = document.createElement('div');
            div.className = 'message bot';

            let buttonsHTML = '';
            if (buttons.length > 0) {
                buttonsHTML = '<div class="quick-buttons">' +
                    buttons.map((b, i) => `<button class="quick-btn" onclick="quickButtons[${i}]()">${b.text}</button>`).join('') +
                    '</div>';
                window.quickButtons = buttons.map(b => b.action);
            }

            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble">${text.replace(/\n/g, '<br>')}${buttonsHTML}</div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addProductCards(products) {
            const div = document.createElement('div');
            div.className = 'message bot';

            const cardsHTML = products.map(p => `
                <div class="product-card">
                    ${p.image ? `<img src="${p.image}" alt="${p.name}">` : ''}
                    <h3>${p.name}</h3>
                    <div class="price">${p.price}</div>
                    <div class="stock ${p.in_stock ? 'in-stock' : 'out-of-stock'}">
                        ${p.in_stock ? '✓ במלאי' : '✗ אזל מהמלאי'}
                    </div>
                    ${p.in_stock ? `<a href="${p.url}" target="_blank" class="buy-btn">קנה עכשיו</a>` : ''}
                </div>
            `).join('');

            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble">
                    מצאתי ${products.length} מוצרים:
                    ${cardsHTML}
                </div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typing';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble">
                    <div class="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function searchProducts(query) {
            showTyping();

            try {
                const apiUrl = query
                    ? `${STORE_URL}/products?search=${encodeURIComponent(query)}&per_page=10`
                    : `${STORE_URL}/products?per_page=10`;
                const url = CORS_PROXY + encodeURIComponent(apiUrl);

                const response = await fetch(url);
                const products = await response.json();

                hideTyping();

                if (products.length === 0) {
                    addBotMessage('לא מצאתי מוצרים מתאימים. נסה חיפוש אחר?', [
                        { text: '📦 כל המוצרים', action: () => searchProducts('') }
                    ]);
                    return;
                }

                const formattedProducts = products.map(p => ({
                    name: p.name,
                    price: `₪${(parseInt(p.prices?.price || 0) / 100).toFixed(0)}`,
                    in_stock: p.is_in_stock,
                    url: p.permalink,
                    image: p.images?.[0]?.src || ''
                }));

                addProductCards(formattedProducts);

            } catch (error) {
                hideTyping();
                addBotMessage('אופס, משהו השתבש. נסה שוב?');
                console.error(error);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addUserMessage(text);
            userInput.value = '';

            // Simple keyword matching
            const lowerText = text.toLowerCase();

            if (lowerText.includes('מגנזיום') || lowerText.includes('magnesium') || lowerText.includes('chalk')) {
                await searchProducts('מגנזיום');
            } else if (lowerText.includes('אימון') || lowerText.includes('training') || lowerText.includes('טיפול')) {
                await searchProducts('אימון');
            } else if (lowerText.includes('וובינר') || lowerText.includes('webinar') || lowerText.includes('אצבע')) {
                await searchProducts('וובינר');
            } else if (lowerText.includes('הכל') || lowerText.includes('מוצרים') || lowerText.includes('all')) {
                await searchProducts('');
            } else if (lowerText.includes('שלום') || lowerText.includes('היי') || lowerText.includes('hello')) {
                addBotMessage('שלום! 😊 איך אפשר לעזור?', [
                    { text: '🏋️ אימונים', action: () => searchProducts('אימון') },
                    { text: '🧴 מגנזיום', action: () => searchProducts('מגנזיום') },
                    { text: '📦 כל המוצרים', action: () => searchProducts('') }
                ]);
            } else {
                // Search for whatever they typed
                await searchProducts(text);
            }
        }
    </script>
</body>
</html>
